name: Cleanup old releases

on:
  workflow_dispatch:
    inputs:
      delete_tags:
        description: "Also delete the git tags of deleted releases"
        type: boolean
        default: true
      dry_run:
        description: "Only list what would be deleted"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all releases except the latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEL_TAGS: ${{ inputs.delete_tags }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          keep_id=$(gh api "repos/$REPO/releases/latest" --jq .id)
          echo "Keeping release id $keep_id"

          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            if [ "$id" = "$keep_id" ]; then
              echo "Keeping $tag"
              continue
            fi
            if [ "$DRY" = "true" ]; then
              echo "[dry run] would delete release $tag"
              continue
            fi
            echo "Deleting release $tag"
            gh api -X DELETE "repos/$REPO/releases/$id" || true
            if [ "$DEL_TAGS" = "true" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || true
            fi
          done
