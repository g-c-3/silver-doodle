name: Build Android APK

# Phase 11. client/android/ is intentionally NOT committed to this repo --
# see docs/DECISIONS.md's "android/ generated fresh in CI" entry
# (2026-09-17) for why. This workflow regenerates it from scratch on every
# run using the real @capacitor/cli (pinned exact versions in
# client/package.json, so the generated template's shape stays stable run
# to run -- see .github/workflows/scripts/patch_build_gradle.py, which
# depends on that), then injects the Phase 1 signing keystore secrets into
# that freshly-generated project before building.
#
# REMOVED 2026-09-19 (report-2.3): this workflow used to also write a
# Firebase google-services.json from a secret and let Capacitor's generated
# build.gradle conditionally apply the google-services Gradle plugin when
# that file existed. Turned out that plugin only processes the config into
# resource values -- it does not pull in any Firebase SDK code by itself,
# and this project never declared the actual Firebase dependencies
# (firebase-analytics, firebase-crashlytics) or a Capacitor plugin for
# them anywhere. So that step was live but functionally inert: it embedded
# a Firebase Web API key into the shipped APK's resources for zero
# benefit, confirmed by report-2.3's real APK decompilation finding no
# Firebase SDK classes at all. See docs/DECISIONS.md's 2026-09-19 (later
# still) entry. If Firebase Analytics/Crashlytics is wanted, it needs a
# real implementation pass (Gradle dependencies + a Capacitor plugin or
# native bridge code + actual client-side event calls), not just this
# config-writing step reinstated. The GOOGLE_SERVICES_JSON secret this
# step used to read is no longer needed by this workflow -- safe to delete
# from the repo's secrets once confirmed nothing else depends on it.
#
# Never run any of these steps locally -- this workflow is the only
# supported way to produce an APK. See docs/ROADMAP.md and
# docs/ARCHITECTURE.md Section 11 for the reasoning.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "supabase/migrations/**" # schema the client depends on shifting is a reason to rebuild too
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/scripts/patch_build_gradle.py"
  workflow_dispatch:
    inputs:
      use_production_ad_unit:
        description: >-
          COMPLIANCE (§5.14): only set true for a real, intentional release
          build heading to real players (e.g. a Play Store submission).
          Every normal rebuild -- including every sideload/dev/test build
          produced so far -- should leave this false and keep using
          Google's test ad unit (see client/src/js/attempt.js).
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # FIXED 2026-09-17, from the fourth live run's actual log: the APK
    # itself built and uploaded fine (BUILD SUCCESSFUL, artifact uploaded),
    # but attaching it to a GitHub Release failed with 403 "Resource not
    # accessible by integration" -- the default GITHUB_TOKEN only gets
    # Contents: read unless a workflow asks for more. Release creation
    # needs write.
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # FIXED 2026-09-17, from the second live run's actual log:
          # @capacitor/cli@8.5.2 refuses to run at all below Node 22
          # ("The Capacitor CLI requires NodeJS >=22.0.0"). 20 was the LTS
          # default at the time this workflow was first written; bumped.
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # FIXED 2026-09-17, from the third live run's actual log:
          # capacitor-android's own module (part of @capacitor/android
          # 8.5.2) compiles against Java 21 source compatibility --
          # "invalid source release: 21" against JDK 17. AGP 8.13.0 (what
          # this Capacitor version generates) fully supports JDK 21.
          java-version: "21"

      - name: Ensure required Android SDK packages are installed
        # ubuntu-latest ships a preinstalled Android SDK, but a very recent
        # compileSdk (Capacitor 8.5.2 currently targets 36) can be newer
        # than what's baked into the runner image -- this makes sure it's
        # there rather than hoping. Safe to re-run; no-ops if already present.
        #
        # FIXED 2026-09-17, from the first live run's actual log: bare
        # `sdkmanager` failed with "command not found" (exit 127) -- it's
        # not on PATH by default on the runner, it lives under
        # $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/. Calling it by full
        # path instead of assuming PATH is the fix; falls back to
        # $ANDROID_HOME in case a future runner image only sets that one.
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under \$ANDROID_SDK_ROOT or \$ANDROID_HOME on this runner." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "platform-tools" > /dev/null

      - name: Install Capacitor and scaffold the native Android project
        working-directory: client
        run: |
          npm install
          npx cap add android

      - name: Bundle supabase-js locally (§5.12)
        # SECURITY FIX (2026-09-19): supabase-js used to load from a CDN at
        # runtime, floating at @2 with no version pin and no Subresource
        # Integrity — see docs/DECISIONS.md's 2026-09-19 (later still)
        # entry. Copied from the exact pinned version in package.json
        # (installed by the step above) straight into src/js/vendor/ —
        # i.e. into client/src itself, BEFORE cap sync runs below, so the
        # file is genuinely part of the webDir cap sync copies, the same
        # "source generated fresh every run, nothing hand-committed"
        # pattern already used for android/ and the app icon. Not
        # committed to the repo — this file won't exist if you look at
        # client/src/js/vendor/ directly; it only exists inside a CI run's
        # workspace and inside the built APK.
        working-directory: client
        run: |
          mkdir -p src/js/vendor
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js src/js/vendor/supabase.js

      - name: Inject production AdMob unit ID (§5.14)
        # COMPLIANCE FIX (2026-09-19, report-2.3): only runs for a build
        # explicitly and intentionally marked as heading to real players
        # (see the workflow_dispatch input above) -- every other build,
        # including every sideload/test build produced up to now, keeps
        # using Google's test ad unit hardcoded in attempt.js and this step
        # is skipped entirely. ADMOB_REWARDED_AD_UNIT_ID_PRODUCTION should
        # hold this project's real registered unit
        # (ca-app-pub-6922359485200410/1441491988 -- the value this
        # constant used to be hardcoded to, before this fix) as a GitHub
        # secret, not committed anywhere.
        if: ${{ github.event.inputs.use_production_ad_unit == 'true' }}
        working-directory: client
        run: |
          if [ -z "${{ secrets.ADMOB_REWARDED_AD_UNIT_ID_PRODUCTION }}" ]; then
            echo "PATCH FAILED: use_production_ad_unit was true but the ADMOB_REWARDED_AD_UNIT_ID_PRODUCTION secret is not set -- refusing to build a release with no real ad unit configured."
            exit 1
          fi
          TEST_ID="ca-app-pub-3940256099942544/5224354917"
          if ! grep -q "$TEST_ID" src/js/attempt.js; then
            echo "PATCH FAILED: the expected test ad unit ID was not found in attempt.js -- it may have already been patched, or the source changed shape. Not overwriting blindly."
            exit 1
          fi
          sed -i "s#$TEST_ID#${{ secrets.ADMOB_REWARDED_AD_UNIT_ID_PRODUCTION }}#" src/js/attempt.js
          echo "Production AdMob unit ID injected for this release build."

      - name: Sync web assets into the native Android project
        working-directory: client
        run: npx cap sync android

      - name: Generate app icon from source art
        # Regenerates every density + adaptive-icon variant from a single
        # source SVG on every run, the same "nothing native is hand-
        # committed" approach as everything else here (see
        # docs/DECISIONS.md's "android/ generated fresh in CI" entry).
        # The source art itself (client/assets/icon.svg) was deliberately
        # switched 2026-09-19 to an externally-sourced image, replacing the
        # originally hand-designed "three-tile diagonal match, neon green
        # glow" icon approved 2026-09-17 — see docs/DECISIONS.md's
        # 2026-09-19 (later still) entry. This step's own logic is
        # unaffected either way; it only ever needed a source image to
        # rasterize, vector or not. Also generates matching splash screens
        # as an Easy Mode side effect (same art, centered on the same
        # background color) -- not asked for, but harmless and visually
        # consistent; easy to turn off later if that turns out not to be
        # wanted.
        working-directory: client
        run: |
          npx @capacitor/assets generate --android \
            --androidProject android --assetPath assets \
            --iconBackgroundColor '#14121f' --iconBackgroundColorDark '#14121f'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > client/android/release.keystore
          cat > client/android/keystore.properties << KEOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          KEOF
          # Never echoed and never committed -- both files live only in this
          # ephemeral runner workspace and vanish when the job ends.

      - name: Register the auth-callback deep link
        # Adds the matchemojisdaily://auth-callback custom-scheme
        # intent-filter to the generated AndroidManifest.xml -- see
        # patch_android_manifest.py and client/src/js/deep-link.js for why
        # this exists: without it, sign-in started inside the app can never
        # complete, since the magic-link email always opens in the system
        # browser (a different origin than the app's own WebView).
        run: python3 .github/workflows/scripts/patch_android_manifest.py

      - name: Configure release signing & bump version
        run: python3 .github/workflows/scripts/patch_build_gradle.py

      - name: Build release APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate the built APK
        id: apk
        run: |
          apk_path=$(find client/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found under app/build/outputs/apk/release -- build must have failed silently." >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-emojis-daily-build-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          # Distribution is manual APK sideload for now (docs/ROADMAP.md
          # Phase 12 gates Play Store submission on the privacy policy page
          # and production ad unit IDs) -- prerelease keeps every build out
          # of the repo's "Latest release" banner until that's ready.
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
