<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Match Emojis Daily app icon — approved design (chat, 2026-09-17):
    Option B (three-tile diagonal match) with a strong neon green glow
    border. Source of truth for this design lives here; regenerate all
    platform sizes via the "capacitor assets generate" command rather than
    hand-editing any generated PNG.

    Known, explicitly accepted risk: the glow sits right at the icon's
    edge. Some Android launchers mask icons into a circle, which would clip
    the glow's corners. Confirmed and accepted as-is; do not "fix" this by
    insetting the glow without checking with the project owner first, since
    that was a deliberate call, not an oversight.
  -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="none" stroke="#39ff6a" stroke-width="6" filter="url(#glow)"/>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="#14121f" stroke="#39ff6a" stroke-width="3"/>
  <rect x="34" y="118" width="52" height="52" rx="14" fill="#ff6f91"/>
  <rect x="74" y="74" width="52" height="52" rx="14" fill="#7c6fff"/>
  <rect x="114" y="30" width="52" height="52" rx="14" fill="#f5b942"/>
</svg>
